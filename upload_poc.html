<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tariq.lb — Report Road Damage</title>

  <!-- Leaflet CSS (loaded from CDN; your browser fetches this) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bar-bg: #14213d;
      --bar-fg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e2e6ee;
      --text: #1b1f2a;
      --muted: #5a6473;
      --accent: #14213d;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bar-bg);
      color: var(--bar-fg);
      padding: 12px 18px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    header span { font-size: 13px; color: #aeb6c6; }

    /* Form bar above the map */
    .form-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .field input[type="file"],
    .field select {
      padding: 6px 8px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }

    .coords {
      font-size: 13px;
      color: var(--text);
      background: #f3f5f9;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      min-width: 220px;
    }
    .coords strong { color: var(--accent); }
    .coords .empty { color: var(--muted); font-style: italic; }

    button.submit {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit:disabled { background: #9aa3b2; cursor: not-allowed; }

    .hint {
      padding: 8px 18px;
      background: #fff8e6;
      border-bottom: 1px solid #f0e2b8;
      font-size: 13px;
      color: #6b5a1f;
    }

    #map { flex: 1 1 auto; width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Tariq.lb</h1>
    <span>Report Road Damage</span>
  </header>

  <div class="hint">Click anywhere on the map to mark where the damage is.</div>

  <!-- The upload form. lat/lng are hidden fields filled in when you click the map. -->
  <form id="report-form" class="form-bar" action="/upload" method="POST" enctype="multipart/form-data">
    <div class="field">
      <label for="photo">Damage photo</label>
      <input type="file" id="photo" name="photo" accept="image/*" />
    </div>

    <div class="field">
      <label for="severity">Severity</label>
      <select id="severity" name="severity">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High" selected>High</option>
        <option value="Critical">Critical</option>
      </select>
    </div>

    <!-- These two are the hidden form fields the task asks for -->
    <input type="hidden" id="lat" name="lat" value="" />
    <input type="hidden" id="lng" name="lng" value="" />

    <div class="coords" id="coords-readout">
      <span class="empty">No location selected yet</span>
    </div>

    <button type="submit" class="submit" id="submit-btn" disabled>Submit report</button>
  </form>

  <div id="map"></div>

  <!-- Leaflet JS (loaded from CDN; your browser fetches this) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // ----- Severity colors + getMarkerColor() (reused from task 3) -----
    const SEVERITY_COLORS = {
      Low:      "#2e9e44",
      Medium:   "#f2c037",
      High:     "#f57c1f",
      Critical: "#e03131",
    };
    const DEFAULT_COLOR = "#7a7a7a";
    function getMarkerColor(severityLabel) {
      return SEVERITY_COLORS[severityLabel] || DEFAULT_COLOR;
    }

    // ----- Map setup: centered on Lebanon -----
    const map = L.map("map").setView([33.85, 35.86], 9);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // ----- Elements we update -----
    const latInput   = document.getElementById("lat");
    const lngInput   = document.getElementById("lng");
    const readout    = document.getElementById("coords-readout");
    const submitBtn  = document.getElementById("submit-btn");
    const severitySel = document.getElementById("severity");

    // Only ONE confirmation marker exists at a time. Starts as null.
    let placementMarker = null;

    // ----- The core of task 4: click the map to capture a location -----
    map.on("click", function (e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      // 1) Store the coordinates in the hidden form fields
      latInput.value = lat.toFixed(6);
      lngInput.value = lng.toFixed(6);

      // 2) Show the user what was captured
      readout.innerHTML =
        `Selected: <strong>${lat.toFixed(5)}, ${lng.toFixed(5)}</strong>`;

      // 3) Drop (or move) the confirmation marker
      const color = getMarkerColor(severitySel.value);
      if (placementMarker) {
        placementMarker.setLatLng(e.latlng);
        placementMarker.setStyle({ fillColor: color });
      } else {
        placementMarker = L.circleMarker(e.latlng, {
          radius: 10,
          color: "#ffffff",
          weight: 2,
          fillColor: color,
          fillOpacity: 0.95,
        }).addTo(map);
      }
      placementMarker.bindPopup("Damage location").openPopup();

      // 4) Now that a location is set, allow submitting
      submitBtn.disabled = false;
    });

    // Keep the marker color in sync if the user changes severity after placing
    severitySel.addEventListener("change", function () {
      if (placementMarker) {
        placementMarker.setStyle({ fillColor: getMarkerColor(severitySel.value) });
      }
    });

    // ----- POC submit handling -----
    // No backend yet, so we don't really POST. We just confirm what WOULD be sent.
    document.getElementById("report-form").addEventListener("submit", function (ev) {
      ev.preventDefault(); // remove this line later, once /upload exists on the backend
      if (!latInput.value || !lngInput.value) {
        alert("Please click the map to set a location first.");
        return;
      }
      alert(
        "Report ready to submit:\n" +
        "Severity: " + severitySel.value + "\n" +
        "Latitude: " + latInput.value + "\n" +
        "Longitude: " + lngInput.value + "\n" +
        "(In the real app this gets sent to the backend.)"
      );
    });
  </script>
</body>
</html>
