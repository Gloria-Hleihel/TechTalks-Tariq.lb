  <text x="34" y="133" font-family="Arial" font-size="7.5" fill="#888" letter-spacing="1.5">ROADS. SOLUTIONS. PROGRESS.</text>
  <line x1="164" y1="129" x2="179" y2="129" stroke="#4a7c59" stroke-width="1.5"/>

