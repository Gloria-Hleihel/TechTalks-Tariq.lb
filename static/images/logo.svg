  <rect x="40" y="15" width="22" height="72" rx="4" fill="#1a1a1a"/>
  
  <!-- Road dashes on T stem -->
  <rect x="50" y="32" width="3" height="10" rx="1" fill="white" opacity="0.7"/>
  <rect x="50" y="48" width="3" height="10" rx="1" fill="white" opacity="0.7"/>
  <rect x="50" y="64" width="3" height="10" rx="1" fill="white" opacity="0.7"/>

  <!-- B vertical bar -->
  <rect x="95" y="15" width="11" height="72" rx="3" fill="#1a1a1a"/>
  
  <!-- B top bump — red -->
  <path d="M106 15 Q138 15 138 36 Q138 57 106 57 L106 15Z" fill="#7b0d1e"/>
  
  <!-- B bottom bump — green -->
  <path d="M106 57 Q142 57 142 72 Q142 87 106 87 L106 57Z" fill="#4a7c59"/>

  <!-- Cedar tree in green bump -->
  <polygon points="124,82 119,68 114,82" fill="white" opacity="0.95"/>
  <polygon points="124,74 119,62 114,74" fill="white" opacity="0.95"/>
  <rect x="118" y="82" width="2" height="5" fill="white" opacity="0.8"/>

  <!-- TARIQ text -->
